<title>NutriLog – Calorie & Nutrition Tracker</title>
<style>
:root{
  --bg:#F5F7F2;--surface:#FFFFFF;--ink:#14302A;--muted:#5E7068;--leaf:#2E7D52;--leaf-soft:#E3F1E8;
  --saffron:#F0B429;--tomato:#D9483B;--blue:#4B8BBE;--line:#E1E7DF;--shadow:0 1px 2px rgba(20,48,42,.06);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0F1A17;--surface:#172421;--ink:#E8F0EB;--muted:#93A59B;--leaf:#5CC48A;--leaf-soft:#1D3328;--line:#243530;--shadow:none}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4}
body{overscroll-behavior:none}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(92px + env(safe-area-inset-bottom))}
h1{font-size:26px;margin:4px 0 2px;letter-spacing:-.02em}
h2{font-size:18px;margin:0 0 8px}
h3{font-size:16px;margin:0}
p{margin:0}
.muted{color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
.btn{background:var(--leaf);color:#fff;font-weight:700;border-radius:14px;padding:13px 18px;text-align:center;width:100%}
.btn.sec{background:var(--leaf-soft);color:var(--leaf)}
.btn.danger{background:none;color:var(--tomato);border:1px solid var(--line)}
.chip{padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
/* date bar */
.datebar{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.iconbtn:disabled{opacity:.35}
/* ring */
.ringwrap{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:168px;height:168px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .big{font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1}
.stat b{display:block;font-size:20px;letter-spacing:-.02em}
.stat{margin-bottom:10px}
/* macros */
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:99px}
/* entries */
.entry{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.entry .name{font-weight:600}
.addbtn{width:36px;height:36px;border-radius:12px;background:var(--leaf);color:#fff;font-size:22px;line-height:1;display:grid;place-items:center}
.x{color:var(--muted);font-size:20px;width:32px;height:32px}
/* water */
.glasses{display:flex;gap:6px;flex-wrap:wrap}
.glass{width:26px;height:34px;border-radius:4px 4px 9px 9px;border:2px solid var(--blue);background:transparent}
.glass.f{background:var(--blue)}
/* tab bar */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:5}
nav .in{display:flex;width:100%;max-width:560px}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);padding:6px 0}
nav button.on{color:var(--leaf);font-weight:700}
nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* meals */
.mealtop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.kcal{font-weight:800;font-size:18px;white-space:nowrap}
.tag{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--leaf-soft);color:var(--leaf);margin-right:6px;display:inline-block;margin-top:6px}
.detail{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:15px}
.detail ul,.detail ol{margin:6px 0 12px;padding-left:20px}
.detail li{margin:3px 0}
/* sheet */
#sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:none}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;
  padding:16px 16px calc(20px + env(safe-area-inset-bottom));z-index:11;display:none;max-width:560px;margin:0 auto}
.res{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.stepper{display:flex;align-items:center;gap:14px;justify-content:center;margin:12px 0}
.stepper button{width:44px;height:44px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:22px}
.stepper b{font-size:22px;min-width:64px;text-align:center}
.tip h3{margin-bottom:4px}
.bars{display:flex;align-items:flex-end;gap:8px;height:150px;position:relative;margin-top:14px}
.bars .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:6px}
.bars .col i{display:block;width:100%;border-radius:8px 8px 3px 3px;background:var(--leaf);min-height:3px}
.bars .col span{font-size:12px;color:var(--muted)}
.goalline{position:absolute;left:0;right:0;border-top:2px dashed var(--saffron)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-size:14px;z-index:20}
.offline{font-size:12px;color:var(--muted)}
.auth{min-height:calc(100vh - 120px);display:flex;flex-direction:column;justify-content:center;padding:12px 0}
.logo{width:64px;height:64px;border-radius:18px;background:var(--leaf);display:grid;place-items:center;margin-bottom:14px}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--leaf);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:800;flex:none}
.badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--leaf-soft);color:var(--leaf);white-space:nowrap}
.badge.basic{background:rgba(75,139,190,.18);color:var(--blue)}
.badge.premium{background:rgba(240,180,41,.28);color:var(--ink)}
.plan{border:2px solid var(--line)}
.plan.cur{border-color:var(--leaf)}
.plan ul{list-style:none;margin:12px 0 14px;padding:0}
.plan li{padding:4px 0 4px 24px;position:relative;font-size:15px}
.plan li::before{content:"\2713";position:absolute;left:0;color:var(--leaf);font-weight:800}
.plan li.no{color:var(--muted)}
.plan li.no::before{content:"\2013";color:var(--muted)}
.price b{font-size:26px;letter-spacing:-.02em}
.lock{border-style:dashed;background:transparent}
.err{color:var(--tomato);font-size:14px;min-height:20px;margin:8px 0}
.btn:disabled{opacity:.6;cursor:default}
@media (prefers-reduced-motion:no-preference){.ring circle.p{transition:stroke-dashoffset .6s ease}}
</style>
</head>

const daysBack=d=>{const a=new Date(),b=new Date(d);return Math.round((new Date(a.getFullYear(),a.getMonth(),a.getDate())-new Date(b.getFullYear(),b.getMonth(),b.getDate()))/864e5)};
function defaultSplit(){const p=S.profile&&S.profile.goal==="lose"?30:25;return {p,f:28,c:100-p-28}}
function targets(){
  const k=S.goal,sp=S.split&&can("split")?S.split:defaultSplit();
  return {k,p:k*sp.p/100/4,c:k*sp.c/100/4,f:k*sp.f/100/9};
}
function calcGoal(p){
  const bmr=10*p.weight+6.25*p.height-5*p.age+(p.sex==="m"?5:-161);
  const tdee=bmr*p.act;
  const adj=GOALS.find(g=>g[0]===p.goal)[2];
  const floor=p.sex==="m"?1500:1200;
  return Math.max(floor,r0((tdee+adj)/10)*10);
}

  const water=S.water[dkey(U.day)]||0;
  const macro=(n,g,tg,col)=>`<div><div class="row between"><b>${n}</b><span class="muted">${r0(g)} / ${r0(tg)} g</span></div><div class="bar"><i style="width:${Math.min(100,g/tg*100)}%;background:${col}"></i></div></div>`;
  return `
  <div class="datebar">
    <button class="iconbtn" data-a="prevday" aria-label="Previous day">‹</button>
    <div style="text-align:center"><h1>${label}</h1></div>

        stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}"/></svg>
      <div class="mid"><span class="big">${Math.abs(r0(left))}</span><span class="muted">${over?"kcal over":"kcal left"}</span></div>

    </div>
  </div>
  <div class="card"><div style="display:grid;gap:12px">
    ${macro("Protein",t.p,T.p,"var(--leaf)")}${macro("Carbs",t.c,T.c,"var(--saffron)")}${macro("Fat",t.f,T.f,"var(--blue)")}
  </div></div>
  ${SLOTS.map(([id,name])=>{
    const es=list.filter(e=>e.m===id),s=sum(es);

  <div class="card"><div class="row between"><div><h2 style="margin:0">Water</h2><span class="muted">${water} of ${S.prefs.water} glasses (${water*250} ml)</span></div>

function macroAvgCard(days){

    <div class="stat"><span class="muted">Fat</span><b>${r0(a.f/n)} g</b><span class="muted">goal ${r0(T.f)}</span></div></div></div>`;

function insightsCard(){
  const days=[...Array(30)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-(29-i));return d});
  const tot=days.map(d=>sum(entries(d)).k),logged=tot.filter(v=>v>0);
  const avg=logged.length?logged.reduce((a,b)=>a+b,0)/logged.length:0;
  const onT=logged.filter(v=>v>=S.goal*.9&&v<=S.goal*1.1).length;
  let streak=0;for(let i=entries(new Date()).length?0:1;i<400;i++){const d=new Date();d.setDate(d.getDate()-i);if(entries(d).length)streak++;else break}
  const cut=dkey(days[0]),ws=S.weights.filter(w=>w.d>=cut).sort((a,b)=>a.d<b.d?-1:1);
  let wc="–";if(ws.length>1){const dv=ws[ws.length-1].kg-ws[0].kg;wc=(dv>0?"+":"")+(imp()?r1(dv*2.20462)+" lb":r1(dv)+" kg")}
  const max=Math.max(S.goal*1.25,...tot);
  return `<div class="card"><h2>30-day insights</h2>
  <div class="grid2" style="margin-top:8px">
    <div class="stat"><span class="muted">Average per logged day</span><b>${r0(avg)} kcal</b></div>
    <div class="stat"><span class="muted">Within 10% of goal</span><b>${logged.length?r0(onT/logged.length*100):0}%</b></div>
    <div class="stat"><span class="muted">Logging streak</span><b>${streak} day${streak===1?"":"s"}</b></div>
    <div class="stat"><span class="muted">Weight change</span><b>${wc}</b></div></div>
  <div class="bars" style="gap:3px;height:110px"><div class="goalline" style="bottom:${S.goal/max*100}%"></div>
    ${tot.map(v=>`<div class="col" style="gap:0"><i style="height:${v/max*100}%;${v>S.goal?"background:var(--tomato)":""}"></i></div>`).join("")}</div>
  <p class="muted" style="margin-top:10px">Last 30 days. Dashed line = your ${S.goal} kcal goal.</p></div>`;
}

function allFoods(){return [...S.custom.map(c=>({n:c.n,k:c.k,p:c.p,c:c.c,f:c.f,mine:1})),...FOODS.map(f=>({n:f[0],k:f[1],p:f[2],c:f[3],f:f[4]}))]}
function recents(){
  const seen=new Set(),out=[];
  Object.keys(S.log).sort().reverse().forEach(d=>[...S.log[d]].reverse().forEach(e=>{
    if(e.u&&!seen.has(e.u.n)&&out.length<8){seen.add(e.u.n);out.push(e.u)}}));
  return out;
}

function fillResults(q){
  q=q.trim().toLowerCase();

  U.results=base;
  $("#results").innerHTML=(q?"":recents().length?`<p class="muted" style="margin-top:12px">Recent and common foods</p>`:`<p class="muted" style="margin-top:12px">Common foods</p>`)+
    base.map((f,i)=>`<button class="res" data-a="pick" data-v="${i}"><span class="grow"><b>${esc(f.n)}</b><br><span class="muted">P ${f.p} · C ${f.c} · F ${f.f}</span></span><b>${r0(f.k)}</b></button>`).join("")||
    `<p class="muted" style="margin-top:12px">No match. Use “Custom food” to add it yourself.</p>`;
}
/* ---- barcode scanning (BarcodeDetector + Open Food Facts) ---- */
const HAS_BD="BarcodeDetector" in window;
let stream=null,scanTimer=null;
function stopScan(){clearInterval(scanTimer);scanTimer=null;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
async function startScan(){
  const v=$("#cam"),m=$("#scanMsg");
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});
    v.srcObject=stream;v.style.display="block";await v.play();
    m.textContent="Point the camera at the barcode.";
    const det=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e"]});
    let busy=false;
    scanTimer=setInterval(async()=>{
      if(busy||!v.videoWidth)return;busy=true;
      try{const r=await det.detect(v);if(r.length){stopScan();lookup(r[0].rawValue)}}catch(e){}
      busy=false;
    },400);
  }catch(e){stopScan();if(m)m.textContent="Camera unavailable. Allow camera access (the page must be opened from its web link), or type the barcode number."}
}
function scanFail(msg){const m=$("#scanMsg");if(m)m.textContent=msg}
async function lookup(code){
  code=String(code||"").trim();
  if(!/^\d{6,14}$/.test(code)){toast("Enter the 6–14 digit barcode number");return}
  scanFail("Looking up "+code+"…");
  let p=S.scanned&&S.scanned[code];
  if(!p){
    try{
      const ctrl=new AbortController(),t=setTimeout(()=>ctrl.abort(),8000);
      const r=await fetch("https://world.openfoodfacts.org/api/v2/product/"+code+".json?fields=product_name,brands,nutriments,serving_quantity",{signal:ctrl.signal});
      clearTimeout(t);
      const j=await r.json();
      if(j.status!==1||!j.product){scanFail("Product not found in the database. Use Custom food instead.");return}
      const n=j.product.nutriments||{};let k=n["energy-kcal_100g"];
      if(k==null&&n.energy_100g!=null)k=n.energy_100g/4.184;
      if(k==null||isNaN(+k)){scanFail("This product has no nutrition data. Use Custom food instead.");return}
      const f1=x=>Math.round((+x||0)*10)/10,brand=j.product.brands?j.product.brands.split(",")[0].trim():"";
      p={code,n:[j.product.product_name,brand].filter(Boolean).join(" – ")||"Product "+code,k:Math.round(+k),p:f1(n.proteins_100g),c:f1(n.carbohydrates_100g),f:f1(n.fat_100g),serving:parseFloat(j.product.serving_quantity)||null};
      S.scanned=S.scanned||{};S.scanned[code]=p;save();
    }catch(e){scanFail("Couldn't reach the food database. Check your connection or use Custom food. Products you scanned before work offline.");return}
  }
  U.sheet.sel=Object.assign({byWeight:1},p);U.sheet.grams=p.serving||100;U.sheet.mode="search";drawSheet();
}
function upd(){
  const s=U.sheet,f=s&&s.sel,o=$("#gout");if(!f||!o)return;
  const r=num(s.grams)/100;
  o.innerHTML='<span style="font-size:30px;font-weight:800">'+r0(f.k*r)+' kcal</span><br><span class="muted">P '+(Math.round(f.p*r*10)/10)+' g · C '+(Math.round(f.c*r*10)/10)+' g · F '+(Math.round(f.f*r*10)/10)+' g</span>';
}
function addEntry(meal,n,qty,u){
  const k=dkey(U.day);(S.log[k]=S.log[k]||[]).push({id:Date.now()+Math.random(),m:meal,n,q:qty,k:u.k*qty,p:u.p*qty,c:u.c*qty,f:u.f*qty,u:{n:u.n,k:u.k,p:u.p,c:u.c,f:u.f}});
  save();
}

    case"tipCat":U.tipCat=v;render();break;
    case"logWeight":{let kg=parseFloat($("#wt").value);if(imp())kg=kg/2.20462;if(!(kg>20&&kg<500)){toast("Enter a valid weight");break}
      const d=dkey(new Date());S.weights=S.weights.filter(w=>w.d!==d);S.weights.push({d,kg:r1(kg)});save();render();break}
    case"saveProfile":{
      const p={sex:$("#pSex").value,age:num($("#pAge").value),height:r1(num($("#pH").value)*(imp()?2.54:1)),weight:r1(num($("#pW").value)/(imp()?2.20462:1)),act:Number($("#pAct").value),goal:$("#pGoal").value};
      if(p.age<14||p.age>100||p.height<100||p.height>250||p.weight<30||p.weight>300){toast("Please check your details");break}
      S.profile=p;S.goal=calcGoal(p);save();U.tab="today";U.meTab="account";render();toast("Daily goal: "+S.goal+" kcal");break}
    case"setGoal":{const k=r0(num($("#pGoalK").value));if(k<1200||k>6000){toast("Choose between 1,200 and 6,000 kcal");break}S.goal=k;save();render();toast("Goal updated");break}
    case"export":{
      if(!can("exp")){upsell("exp");break}
      const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a2=document.createElement("a");
      a2.href=url;a2.download="nutrilog-backup.json";a2.click();setTimeout(()=>URL.revokeObjectURL(url),1000);break}
    case"reset":if(confirm("Erase all your logs, goals and weights from this device? This can't be undone.")){
      try{localStorage.removeItem(dataKey())}catch(e){}S=blank();U.tab="me";U.meTab="body";render()}break;
    /* ---- accounts & plans ---- */
    case"signup":signup();break;
    case"login":login();break;
    case"authMode":U.auth=v;U.authErr="";if(A.guest&&!A.session){A.guest=false;saveA()}render();break;
    case"guest":A.guest=true;A.session=null;saveA();loadData();U.tab=S.profile?"today":"me";U.meTab=S.profile?"account":"body";U.day=new Date();render();break;
    case"logout":A.session=null;A.guest=false;saveA();U.auth="login";U.authErr="";U.tab="today";render();break;
    case"meTab":U.meTab=v;render();break;
    case"saveName":{const n=$("#uName").value.trim();if(!n){toast("Enter your name");break}acct().name=n;saveA();render();toast("Name saved");break}
    case"changePw":changePw();break;
    case"deleteAccount":if(confirm("Delete this account and all its data from this device? This can't be undone.")){
      const em=A.session;delete A.users[em];try{localStorage.removeItem("nutrilog.data."+em)}catch(e){}
      A.session=null;A.guest=false;saveA();U.auth="signup";U.authErr="";render()}break;
    case"upsell":upsell(v);break;
    case"plans":closeSheet();U.tab="me";U.meTab="plans";render();break;
    case"choosePlan":{
      if(!A.session){A.guest=false;U.auth="signup";U.authErr="";saveA();render();break}
      if(RANK[v]>RANK[plan()])openPanel({checkout:v});
      else if(confirm("Switch to "+PLANS[v].n+"? Your data is kept, but some features will lock.")){setPlan(v);U.day=new Date();render();toast("Switched to "+PLANS[v].n)}
      break}
    case"confirmPlan":setPlan(v);closeSheet();render();toast("You're on "+PLANS[v].n);break;
    case"saveSplit":{const sp={p:r0(num($("#sP").value)),c:r0(num($("#sC").value)),f:r0(num($("#sF").value))};
      if(sp.p+sp.c+sp.f!==100){toast("Split must total 100%");break}
      if(Math.min(sp.p,sp.c,sp.f)<5||Math.max(sp.p,sp.c,sp.f)>70){toast("Keep each macro between 5% and 70%");break}
      S.split=sp;save();render();toast("Macro targets saved");break}
    case"resetSplit":S.split=null;save();render();toast("Using default split");break;
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&U.sheet)closeSheet();
  if(e.key==="Enter"&&/^a(Name|Email|Pass)$/.test(e.target.id)){const b=document.querySelector(".auth .btn");if(b)b.click()}
});
/* ---- account helpers ---- */
function setPlan(id){const u=acct();if(!u)return;u.plan=id;u.planSince=Date.now();saveA()}
function setPref(k,v){
  if(k==="water"){v=Math.max(1,Math.min(20,Math.round(+v)||8))}
  S.prefs[k]=v;save();render();toast("Saved");
}
const hex=b=>Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("");
async function hashPw(pw,salt){
  if(!(window.crypto&&crypto.subtle))throw new Error("nocrypto");
  const enc=new TextEncoder(),key=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveBits"]);
  return hex(await crypto.subtle.deriveBits({name:"PBKDF2",salt:enc.encode(salt),iterations:100000,hash:"SHA-256"},key,256));
}
const newSalt=()=>hex(crypto.getRandomValues(new Uint8Array(16)));
function authErr(m){U.authErr=m;const e=$("#aErr");if(e)e.textContent=m}
function enter(email){A.session=email;A.guest=false;saveA();loadData();U.authErr="";U.day=new Date();U.tab=S.profile?"today":"me";U.meTab=S.profile?"account":"body";render()}
async function signup(){
  const name=$("#aName").value.trim(),email=$("#aEmail").value.trim().toLowerCase(),pw=$("#aPass").value;
  if(!name)return authErr("Enter your name.");
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))return authErr("Enter a valid email address.");
  if(pw.length<8)return authErr("Password must be at least 8 characters.");
  if(A.users[email])return authErr("An account with this email already exists. Log in instead.");
  try{
    const salt=newSalt(),hash=await hashPw(pw,salt);
    A.users[email]={name,email,salt,hash,plan:"free",created:Date.now()};
    if(!A.legacyAdopted&&hasLegacy()){try{localStorage.setItem("nutrilog.data."+email,localStorage.getItem(LEGACY))}catch(e){}A.legacyAdopted=true}
    enter(email);toast("Welcome, "+name.split(" ")[0]);
  }catch(e){authErr("Secure sign-up isn't available here. Open the app from its https link.")}
}
async function login(){
  const email=$("#aEmail").value.trim().toLowerCase(),pw=$("#aPass").value,u=A.users[email];
  if(!email||!pw)return authErr("Enter your email and password.");
  try{
    const h=u?await hashPw(pw,u.salt):null;
    if(!u||h!==u.hash)return authErr("Email or password is incorrect.");
    enter(email);
  }catch(e){authErr("Secure log-in isn't available here. Open the app from its https link.")}
}
async function changePw(){
  const u=acct(),o=$("#oPw").value,n=$("#nPw").value,m=t=>{$("#pwErr").textContent=t};
  if(n.length<8)return m("New password must be at least 8 characters.");
  try{
    if(await hashPw(o,u.salt)!==u.hash)return m("Current password is incorrect.");
    u.salt=newSalt();u.hash=await hashPw(n,u.salt);saveA();$("#oPw").value="";$("#nPw").value="";m("");toast("Password updated");
  }catch(e){m("Couldn't update the password here.")}
}
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(()=>{})}
render();
</script>
